[project]
name = "haptic-hub"
version = "0.1.0"
description = "Center hub: glasses frames in, collision perception, haptic commands out to the belt."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "websockets>=14.0",
    "bleak>=0.22",
]

[project.optional-dependencies]
# Heavy ML stack. Not needed for the belt bench test, the fake perception or the unit tests.
vision = [
    "torch>=2.3",
    "transformers>=4.45",
    "ultralytics>=8.3",
    "lap>=0.5",  # ByteTrack dependency; ultralytics would otherwise pip-install it at runtime
    "pillow>=10.0",
]

[project.scripts]
haptic-hub = "haptic_hub.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haptic_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
