; HapticBelt firmware. See ../docs/protocol.md for the BLE contract.
;   pio run -e esp32dev -t upload     build + flash
;   pio device monitor                serial log (115200)
;   pio test -e native                run logic tests on your laptop (no board)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
; Stamps the git commit into the info and status characteristics (docs/protocol.md).
extra_scripts = pre:scripts/build_id.py
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11

; Host-side unit tests for lib/belt_core (protocol decoding + haptic state machine).
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
